experiment_name: "racc_grid4x4"
seed: 42
log_dir: "./logs"
result_dir: "./results"

env:
  name: "sumo"
  scenario_dir: "data/scenarios/grid4x4"
  net_file: "grid.net.xml"
  route_file: "grid.rou.xml"
  config_file: "grid.sumocfg"
  use_gui: false
  num_seconds: 1800
  delta_time: 5
  yellow_time: 3
  min_green: 5
  max_green: 60
  reward_type: "delay_queue"
  observation_type: "queue_wait_phase_flow"
  demand_jitter: 30

network:
  rows: 4
  cols: 4
  edge_length: 200
  num_lanes: 1
  speed_limit: 13.89

agent:
  name: "mappo"
  hidden_dim: 128
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5

training:
  num_episodes: 100
  batch_size: 256
  update_interval: 100
  eval_interval: 10
  num_eval_episodes: 5
  save_interval: 25
  use_gpu: true
  gpus: "2,3"

offline:
  enabled: false
  dataset_path: null

dynamic_graph:
  enabled: true
  comm_type: "racc"
  graph_type: "static"
  neighbor_k: 1
  gate_threshold: 0.35
  warmup_updates: 5
  dropout: 0.0
  comm_cost_coef: 0.01
  reliability_coef: 0.1
  counterfactual_coef: 0.1
  counterfactual_samples: 2
  counterfactual_temperature: 0.1
  counterfactual_margin: 0.05

robustness:
  enabled: false
  perturbations: []

evaluation:
  metrics:
    - "average_travel_time"
    - "average_waiting_time"
    - "queue_length"
    - "throughput"
    - "communication_rate"
    - "mean_reliability"
