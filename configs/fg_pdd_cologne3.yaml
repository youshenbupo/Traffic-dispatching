_base_: "fg_pdd_grid4x4.yaml"
experiment_name: "fg_pdd_cologne3"

env:
  scenario_dir: "data/datasets/libsignal/cologne3"
  net_file: "cologne3.net.xml"
  route_file: "cologne3.rou.xml"
  config_file: "cologne3.sumocfg"
  num_seconds: 3600
  delta_time: 5
  yellow_time: 3
  min_green: 5
  max_green: 60
  demand_jitter: 0
  queue_obs_scale: 10.0
  wait_obs_scale: 100.0
  flow_obs_scale: 10.0
  reward_scale: 0.001
  pad_heterogeneous_spaces: true

network:
  rows: 1
  cols: 3
  edge_length: 1000
  num_lanes: 1
  speed_limit: 13.89
  tl_type: "static"

training:
  num_episodes: 10
  batch_size: 256
  eval_interval: 5
  num_eval_episodes: 2
  save_interval: 10

dynamic_graph:
  decision_teacher_path: "logs/mappo_cologne3_continue_s{seed}/final_model"
