_base_: "mappo_hangzhou4x4.yaml"
experiment_name: "mappo_cologne3"

env:
  scenario_dir: "data/datasets/libsignal/cologne3"
  net_file: "cologne3.net.xml"
  route_file: "cologne3.rou.xml"
  config_file: "cologne3.sumocfg"
  num_seconds: 3600
  demand_jitter: 0
  queue_obs_scale: 10.0
  wait_obs_scale: 100.0
  flow_obs_scale: 10.0
  reward_scale: 0.001
  pad_heterogeneous_spaces: true

network:
  rows: 1
  cols: 3

training:
  num_episodes: 10
  eval_interval: 5
  num_eval_episodes: 2
  save_interval: 10

robustness:
  enabled: true
  perturbations:
    - type: "agent_observation_dropout"
      prob: 0.2
